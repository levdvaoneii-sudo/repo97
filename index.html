<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Электронный журнал ЛИнТеха - информация</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #ffffff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }

  /* Баннер без стилей — чистый img по центру */
  .banner-trigger {
    cursor: pointer;
    max-width: 80vw;
    display: block;
  }

  /* Плавающее окно — Liquid Glass */
  .glass-window {
    position: fixed;
    top: 8vh;
    left: 50%;
    transform: translateX(-50%);
    width: min(920px, 92vw);
    height: min(640px, 82vh);
    min-width: 420px;
    min-height: 320px;
    display: none;
    flex-direction: column;
    border-radius: 24px;
    overflow: hidden;
    z-index: 9999;

    /* Основной liquid glass слой */
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(28px) saturate(1.8);
    -webkit-backdrop-filter: blur(28px) saturate(1.8);

    /* Светящаяся кромка */
    border: 1px solid rgba(255, 255, 255, 0.35);

    /* Внутренний блик + внешняя тень */
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.45),
      inset 0 -1px 0 rgba(255, 255, 255, 0.08),
      0 24px 64px rgba(0, 0, 0, 0.18),
      0 8px 24px rgba(0, 0, 0, 0.08);
  }

  .glass-window[data-open="true"] {
    display: flex;
  }

  /* Спекулярный блик на верхней кромке — псевдоэлемент */
  .glass-window::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(
      90deg,
      transparent 0%,
      rgba(255, 255, 255, 0.7) 20%,
      rgba(255, 255, 255, 0.7) 80%,
      transparent 100%
    );
    z-index: 10;
    pointer-events: none;
  }

  /* Шапка окна */
  .glass-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    cursor: move;
    user-select: none;
    position: relative;
    z-index: 5;
    background: rgba(255, 255, 255, 0.06);
    border-bottom: 1px solid rgba(255, 255, 255, 0.12);
  }

  .glass-title {
    font-size: 14px;
    font-weight: 600;
    color: rgba(0, 0, 0, 0.72);
    letter-spacing: -0.01em;
  }

  /* Пилюля */
  .pill {
    display: inline-flex;
    align-items: center;
    padding: 3px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    color: rgba(120, 80, 0, 0.9);
    background: rgba(255, 214, 100, 0.35);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 214, 100, 0.5);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5);
  }

  .header-spacer { flex: 1; }

  /* Кнопки управления — стеклянные капсулы */
  .win-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.3);
    background: rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    color: rgba(0, 0, 0, 0.55);
    transition: background 0.2s, transform 0.15s;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
  }

  .win-btn:hover {
    background: rgba(255, 255, 255, 0.35);
    transform: scale(1.06);
  }

  .win-btn:active {
    transform: scale(0.94);
    background: rgba(255, 255, 255, 0.5);
  }

  .win-btn.close {
    color: rgba(180, 0, 0, 0.6);
  }

  .win-btn.close:hover {
    background: rgba(255, 100, 100, 0.3);
  }

  /* Iframe */
  .glass-iframe {
    flex: 1;
    border: none;
    width: 100%;
    height: 100%;
    background: #fff;
    border-radius: 0 0 24px 24px;
  }

  /* Ручка ресайза — стеклянная */
  .resize-handle {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 20px;
    height: 20px;
    cursor: nwse-resize;
    z-index: 20;
    background: linear-gradient(
      135deg,
      transparent 40%,
      rgba(255, 255, 255, 0.6) 40%,
      rgba(255, 255, 255, 0.6) 55%,
      transparent 55%,
      transparent 65%,
      rgba(255, 255, 255, 0.4) 65%,
      rgba(255, 255, 255, 0.4) 75%,
      transparent 75%
    );
    border-radius: 0 0 24px 0;
    opacity: 0.7;
    transition: opacity 0.2s;
  }

  .resize-handle:hover {
    opacity: 1;
  }

  /* Fallback для браузеров без backdrop-filter */
  @supports not (backdrop-filter: blur(1px)) {
    .glass-window {
      background: rgba(255, 255, 255, 0.92);
    }
    .glass-header {
      background: rgba(240, 240, 240, 0.95);
    }
    .win-btn {
      background: rgba(230, 230, 230, 0.9);
    }
  }

  /* Уважение к настройке reduce transparency */
  @media (prefers-reduced-transparency: reduce) {
    .glass-window {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    .glass-header {
      background: rgba(245, 245, 245, 0.98);
    }
  }
</style>
</head>
<body>

  <!-- Баннер без стилей — просто img по центру, клик открывает окно -->
  <img src="banner.png"
       alt="Баннер"
       class="banner-trigger"
       onclick="openGlassWindow()">

  <!-- Плавающее Liquid Glass окно -->
  <div id="glassWindow" class="glass-window" data-open="false">

    <div id="glassHeader" class="glass-header">
      <span class="glass-title">Старая версия электронного дневника</span>
      <span class="pill">Скоро новая версия</span>
      <span class="header-spacer"></span>
      <button class="win-btn" onclick="toggleMaximize()" title="Развернуть">⤢</button>
      <button class="win-btn close" onclick="closeGlassWindow()" title="Закрыть">✕</button>
    </div>

    <iframe id="glassFrame"
            class="glass-iframe"
            src=""
            allow="fullscreen"
            loading="lazy"></iframe>

    <div id="resizeHandle" class="resize-handle"></div>
  </div>

<script>
  const win = document.getElementById('glassWindow');
  const header = document.getElementById('glassHeader');
  const frame = document.getElementById('glassFrame');
  const handle = document.getElementById('resizeHandle');

  let isMaximized = false;
  let savedRect = null;

  function openGlassWindow() {
    if (!frame.src || frame.src === 'about:blank') {
      frame.src = 'https://journal.school28-kirov.ru/';
    }
    win.dataset.open = 'true';
  }

  function closeGlassWindow() {
    win.dataset.open = 'false';
  }

  function toggleMaximize() {
    if (!isMaximized) {
      savedRect = {
        top: win.style.top,
        left: win.style.left,
        transform: win.style.transform,
        width: win.style.width,
        height: win.style.height
      };
      win.style.top = '12px';
      win.style.left = '12px';
      win.style.transform = 'none';
      win.style.width = 'calc(100vw - 24px)';
      win.style.height = 'calc(100vh - 24px)';
      isMaximized = true;
    } else {
      win.style.top = savedRect.top || '8vh';
      win.style.left = savedRect.left || '50%';
      win.style.transform = savedRect.transform || 'translateX(-50%)';
      win.style.width = savedRect.width || 'min(920px, 92vw)';
      win.style.height = savedRect.height || 'min(640px, 82vh)';
      isMaximized = false;
    }
  }

  // Перетаскивание
  let dragging = false, dragStartX = 0, dragStartY = 0, startLeft = 0, startTop = 0;

  header.addEventListener('mousedown', (e) => {
    if (e.target.tagName === 'BUTTON') return;
    dragging = true;
    const rect = win.getBoundingClientRect();
    win.style.transform = 'none';
    win.style.left = rect.left + 'px';
    win.style.top = rect.top + 'px';
    win.style.width = rect.width + 'px';
    win.style.height = rect.height + 'px';
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    startLeft = rect.left;
    startTop = rect.top;
    e.preventDefault();
  });

  document.addEventListener('mousemove', (e) => {
    if (dragging) {
      win.style.left = (startLeft + e.clientX - dragStartX) + 'px';
      win.style.top = (startTop + e.clientY - dragStartY) + 'px';
    }
    if (resizing) {
      const newW = Math.max(420, startW + e.clientX - resizeStartX);
      const newH = Math.max(320, startH + e.clientY - resizeStartY);
      win.style.width = newW + 'px';
      win.style.height = newH + 'px';
    }
  });

  document.addEventListener('mouseup', () => {
    dragging = false;
    resizing = false;
  });

  // Ресайз
  let resizing = false, resizeStartX = 0, resizeStartY = 0, startW = 0, startH = 0;

  handle.addEventListener('mousedown', (e) => {
    resizing = true;
    const rect = win.getBoundingClientRect();
    win.style.transform = 'none';
    win.style.left = rect.left + 'px';
    win.style.top = rect.top + 'px';
    win.style.width = rect.width + 'px';
    win.style.height = rect.height + 'px';
    resizeStartX = e.clientX;
    resizeStartY = e.clientY;
    startW = rect.width;
    startH = rect.height;
    e.preventDefault();
    e.stopPropagation();
  });
</script>

</body>
</html>
